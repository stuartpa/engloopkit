schema_version: "1.0"

extension:
  # Product/release identity stays EngLoopKit; this installed command extension owns
  # the ordered speckit.engloop picker namespace.
  id: "engloop"
  name: "EngLoopKit"
  version: "1.15.2"
  description: "Ordered evidence-gated delivery, operations learning, positive history, handoffs, verified ELK/SEK upgrades, stewardship, publication, and private overlay workflow for Spec Kit."
  author: "stuartpa"
  repository: "https://github.com/stuartpa/engloopkit"
  license: "MIT"
  homepage: "https://github.com/stuartpa/engloopkit"

requires:
  speckit_version: ">=0.12.0"
  tools:
    - name: "dotnet"
      version: ">=10.0"
      required: true
    - name: "sek"
      version: "0.1.3"
      required: true

provides:
  commands:
    - name: "speckit.engloop.01-northstar"
      file: "commands/speckit.engloop.01-northstar.md"
      description: "Define or evolve the singleton root NORTHSTAR.md from evidence-backed direction."
    - name: "speckit.engloop.02-scaffold"
      file: "commands/speckit.engloop.02-scaffold.md"
      description: "Prove the selected test runway and record deterministic Stage 02 evidence."
    - name: "speckit.engloop.03-architect"
      file: "commands/speckit.engloop.03-architect.md"
      description: "Derive and govern architecture from current direction and scaffold evidence."
    - name: "speckit.engloop.04-refactor"
      file: "commands/speckit.engloop.04-refactor.md"
      description: "Implement one accepted SPEC, REFACT plan, or repair slice under binding North Star and architecture guidance; do not re-plan."
    - name: "speckit.engloop.05-model"
      file: "commands/speckit.engloop.05-model.md"
      description: "Author and validate the independent behavior model including rejection semantics."
    - name: "speckit.engloop.06-explore"
      file: "commands/speckit.engloop.06-explore.md"
      description: "Explore model scenarios, regenerate deterministic suites, and capture CORD evidence."
    - name: "speckit.engloop.07-validate"
      file: "commands/speckit.engloop.07-validate.md"
      description: "Execute generated-only functional validation and produce reachability evidence."
    - name: "speckit.engloop.08-unittest"
      file: "commands/speckit.engloop.08-unittest.md"
      description: "Classify unreached paths, enforce delete/revalidate ordering, then compute final readiness."
    - name: "speckit.engloop.09-debugger-walk-thru"
      file: "commands/speckit.engloop.09-debugger-walk-thru.md"
      description: "Recommend and track an engineer-led debugger walkthrough without blocking review preparation."
    - name: "speckit.engloop.10-codereview-prepare"
      file: "commands/speckit.engloop.10-codereview-prepare.md"
      description: "Minimize and validate the current PR after the current Stage 08 readiness PASS."
    - name: "speckit.engloop.20-incident"
      file: "commands/speckit.engloop.20-incident.md"
      description: "Stabilize real incidents under current direction and relevant learning cues; record mitigation-only evidence."
    - name: "speckit.engloop.21-postmortem"
      file: "commands/speckit.engloop.21-postmortem.md"
      description: "Analyze stabilized incidents against current direction and pyramid rules into validated PM/LEARN/RPI contracts."
    - name: "speckit.engloop.22-repair"
      file: "commands/speckit.engloop.22-repair.md"
      description: "Route and close rule-bound repair obligations through exact executable and readiness gates."
    - name: "speckit.engloop.23-happy-minute"
      file: "commands/speckit.engloop.23-happy-minute.md"
      description: "Record a wonderful outcome and the readily available conditions worth remembering."
    - name: "speckit.engloop.30-token-efficiency-analyze"
      file: "commands/speckit.engloop.30-token-efficiency-analyze.md"
      description: "Analyze VS Code Copilot chat speed and token waste with Chronicle/session evidence and no source changes."
    - name: "speckit.engloop.31-token-efficiency-implement"
      file: "commands/speckit.engloop.31-token-efficiency-implement.md"
      description: "Implement only explicitly approved token-efficiency repairs with scoped preflight and compact validation."
    - name: "speckit.engloop.40-refactor-plan"
      file: "commands/speckit.engloop.40-refactor-plan.md"
      description: "Work with the user to create one North-Star- and architecture-aligned REFACT plan; no product code is changed."
    - name: "speckit.engloop.41-deadcode"
      file: "commands/speckit.engloop.41-deadcode.md"
      description: "Propose and, only after explicit approval, remove one high-certainty dead-code candidate."
    - name: "speckit.engloop.42-learnings-pyramid"
      file: "commands/speckit.engloop.42-learnings-pyramid.md"
      description: "Validate source/card/index/retrieval learnings completeness and provenance."
    - name: "speckit.engloop.50-handoff-create"
      file: "commands/speckit.engloop.50-handoff-create.md"
      description: "Create a numbered evidence-backed handoff for another chat window or engineering team."
    - name: "speckit.engloop.60-overlay-pack"
      file: "commands/speckit.engloop.60-overlay-pack.md"
      description: "Verify and pack a private ELK overlay into one portable local ZIP archive."
    - name: "speckit.engloop.61-overlay-remove"
      file: "commands/speckit.engloop.61-overlay-remove.md"
      description: "Remove an installed private ELK overlay and restore prior local hooks."
    - name: "speckit.engloop.70-six-pager-create"
      file: "commands/speckit.engloop.70-six-pager-create.md"
      description: "Create a six-page narrative decision memo in Markdown and convert it to a validated Word document."
    - name: "speckit.engloop.71-powerpnt-create"
      file: "commands/speckit.engloop.71-powerpnt-create.md"
      description: "Create an evidence-backed Markdown-first PowerPoint deck with collision-checked architecture and model graphs."
    - name: "speckit.engloop.72-academic-paper-create"
      file: "commands/speckit.engloop.72-academic-paper-create.md"
      description: "Create an evidence-backed systems research paper in Markdown and convert it to a validated PDF."
    - name: "speckit.engloop.80-upgrade-elk"
      file: "commands/speckit.engloop.80-upgrade-elk.md"
      description: "Upgrade the root-local ELK tool and extension to the latest verified release, or report that both are current."

tags:
  - "loop-engineering"
  - "spec-driven"
  - "model-checking"
  - "operations"
  - "positive-history"
  - "readiness"
