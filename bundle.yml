schema_version: "1.0"

bundle:
  id: "engloopkit"
  name: "EngLoopKit"
  version: "1.15.0"
  role: "loop-engineer"
  description: "Ordered evidence-gated delivery, operations learning, positive history, handoffs, verified ELK/SEK upgrades, stewardship, publication, and private overlay workflow for Spec Kit."
  author: "stuartpa"
  license: "MIT"

requires:
  speckit_version: ">=0.12.0"

# The bundle installs the SEK Spec Kit extension at the exact release used by ELK's
# model-based stages. The matching root-local tool/model packages are restored from the
# v0.1.3 GitHub release with pinned SHA-256 values by ensure-sek-v0.1.3.ps1.
tools: []
mcp: []

provides:
  extensions:
    # EngLoopKit's exact lifecycle, review, session-memory, and overlay utility surface.
    - id: "engloop"
      version: "1.15.0"

    # Architecture governance for the post-bridging architecture stage and for
    # honoring the long-lived architecture on every subsequent loop.
    # Resolves from the architecture-guard catalog (see README > Install).
    - id: "architecture-guard"
      version: "1.11.0"

    # Lightweight single-file flow for repair items that do not need the full
    # specify -> plan -> tasks -> implement loop.
    # Resolves from the tinyspec catalog (see README > Install).
    - id: "tinyspec"
      version: "1.0.0"

    # Independent model-based testing product and its product-owned Agent Skills.
    - id: "sek"
      version: "0.1.3"

tags:
  - "loop-engineering"
  - "spec-driven"
  - "model-checking"
  - "operations"
  - "positive-history"
  - "token-efficiency"
