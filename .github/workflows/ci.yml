name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EngLoopKit
        uses: actions/checkout@v4
        with:
          path: EngLoopKit

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.303"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact Spec Kit CLI
        run: |
          python -m pip install --disable-pip-version-check specify-cli==0.12.4
          specify --version | grep -Fx "specify 0.12.4"

      - name: Initialize Spec Kit host
        working-directory: EngLoopKit
        run: |
          specify init --here --force --integration copilot --script sh --ignore-agent-tools
          test -d .specify

      - name: Restore exact SEK v0.1.3 release dependency
        working-directory: EngLoopKit
        shell: pwsh
        run: ./scripts/ensure-sek-v0.1.3.ps1 -Root . -InstallExtension

      - name: Build .slnx
        working-directory: EngLoopKit
        run: dotnet build EngLoopKit.slnx -c Debug

      - name: Test .slnx
        working-directory: EngLoopKit
        run: dotnet test EngLoopKit.slnx -c Debug --no-build
